{% extends "base.html" %}
{% block title %}Log in · MiniSocial{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="eyebrow">WELCOME BACK</div><h1>Good to see you.</h1><p class="muted">Log in to catch up with your community.</p>
  <form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<button class="primary-btn">Log in</button></form>
  <p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</section>
{% endblock %}
